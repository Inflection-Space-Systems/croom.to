name: Dashboard trial
on:
  push:
    branches: [main]
    paths: ['src/croom-dashboard/**', '.github/workflows/dashboard-trial.yml']
  pull_request:
    paths: ['src/croom-dashboard/**', '.github/workflows/dashboard-trial.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: croom
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: croom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U croom -d croom_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'src/croom-dashboard/*/package-lock.json'
      - run: npm ci && npm test
        working-directory: src/croom-dashboard/backend
        env:
          DB_HOST: localhost
          DB_NAME: croom_test
          DB_USER: croom
          DB_PASSWORD: test-only-password
      - run: npm ci && npm run build
        working-directory: src/croom-dashboard/frontend
  images:
    if: github.event_name != 'pull_request' && github.repository == 'Inflection-Space-Systems/croom.to'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src/croom-dashboard/${{ matrix.component }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/inflection-space-systems/croom-dashboard-${{ matrix.component }}:sha-${{ github.sha }}
